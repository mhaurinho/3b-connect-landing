<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"negocio","type":"string","label":"Nome do negócio","default":"Studio Exemplo"},
    {"id":"bot","type":"string","label":"Nome do bot","default":"Lia"},
    {"id":"telegram","type":"string","label":"@ do bot no Telegram","default":"@studio_exemplo_bot"},
    {"id":"chamada","type":"string","label":"Frase de abertura","default":"Agende seu ensaio a qualquer hora"},
    {"id":"pergunta","type":"string","label":"Pergunta do cliente","default":"Vocês abrem sábado?"},
    {"id":"resposta","type":"string","label":"Resposta do bot","default":"Abrimos sim! De terça a sábado, das 9h às 18h. Quer que eu peça um horário para a equipe? 📸"},
    {"id":"item1","type":"string","label":"O que o bot faz (1)","default":"Tira dúvidas sobre os ensaios"},
    {"id":"item2","type":"string","label":"O que o bot faz (2)","default":"Lembra de você na próxima conversa"},
    {"id":"item3","type":"string","label":"O que o bot faz (3)","default":"Pede seu horário para a equipe confirmar"},
    {"id":"final","type":"string","label":"Frase final","default":"Chame no Telegram"},
    {"id":"cor","type":"color","label":"Cor principal","default":"#7C4DEB"},
    {"id":"fundo","type":"color","label":"Cor de fundo","default":"#12101C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Vídeo do meu bot</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sora"; font-weight: 700; src: url("fonts/sora-700.ttf"); }
      @font-face { font-family: "Sora"; font-weight: 800; src: url("fonts/sora-800.ttf"); }
      @font-face { font-family: "Source Sans"; font-weight: 400; src: url("fonts/source-sans-400.ttf"); }
      @font-face { font-family: "Source Sans"; font-weight: 600; src: url("fonts/source-sans-600.ttf"); }
      @font-face { font-family: "Source Sans"; font-weight: 700; src: url("fonts/source-sans-700.ttf"); }

      body { margin: 0; background: #12101c; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: var(--fundo, #12101c); color: #f5f3ff;
        font-family: "Source Sans", sans-serif;
      }
      .glow {
        position: absolute; width: 1400px; height: 1400px; left: -160px; top: 260px; border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--cor, #7C4DEB) 55%, transparent) 0%, transparent 62%);
        opacity: 0.55;
      }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 90px; box-sizing: border-box; }
      .brand { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font: 700 40px "Sora", sans-serif; letter-spacing: 0.02em; color: #cfc8ff; }
      .tag {
        display: block; font: 700 34px "Source Sans", sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--cor, #7C4DEB); background: #ffffff; border-radius: 999px; padding: 12px 34px; margin-bottom: 48px;
      }
      .big { font: 800 112px/1.05 "Sora", sans-serif; text-align: center; margin: 0; max-width: 900px; letter-spacing: -0.02em; }
      .sub { font: 600 46px/1.3 "Source Sans", sans-serif; text-align: center; color: #d9d4f5; margin: 40px 0 0; max-width: 860px; }

      /* Cena 2: o celular */
      .phone {
        width: 820px; height: 1000px; border-radius: 72px; background: #f4f2fb; color: #1b1d24;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5); overflow: hidden; display: flex; flex-direction: column;
      }
      .phone-head { display: flex; align-items: center; gap: 24px; padding: 54px 48px 32px; background: #ffffff; border-bottom: 2px solid #e6e2f3; }
      .avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--cor, #7C4DEB); color: #fff; display: grid; place-items: center; font: 800 48px "Sora", sans-serif; }
      .who { font: 700 44px "Sora", sans-serif; }
      .who small { display: block; font: 600 30px "Source Sans", sans-serif; color: #10a36f; }
      .chat { flex: 1; padding: 48px 40px; display: flex; flex-direction: column; gap: 30px; }
      .bubble { max-width: 600px; padding: 26px 34px; border-radius: 40px; font: 600 42px/1.32 "Source Sans", sans-serif; }
      .me { align-self: flex-end; background: #d9f5c9; border-bottom-right-radius: 12px; }
      .bot { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 12px; box-shadow: 0 6px 20px rgba(27, 29, 36, 0.08); }
      .reply { position: relative; align-self: stretch; display: flex; flex-direction: column; }
      .typing { position: absolute; top: 0; left: 0; display: flex; gap: 14px; padding: 30px 36px; background: #ffffff; border-radius: 40px; }
      .typing i { width: 22px; height: 22px; border-radius: 50%; background: #9b95b5; display: block; }
      .note { margin-top: 36px; font: 600 30px "Source Sans", sans-serif; color: #a9a2c9; letter-spacing: 0.06em; text-transform: uppercase; }

      /* Cena 3: lista */
      .list { display: flex; flex-direction: column; gap: 40px; margin-top: 70px; width: 900px; }
      .item { display: flex; align-items: center; gap: 34px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.14); border-radius: 36px; padding: 36px 40px; }
      .check { flex: none; width: 84px; height: 84px; border-radius: 26px; background: var(--cor, #7C4DEB); display: grid; place-items: center; font: 800 50px "Sora", sans-serif; color: #fff; }
      .item span { font: 700 46px/1.25 "Source Sans", sans-serif; }

      /* Cena 4: chamada */
      .handle { margin-top: 56px; max-width: 940px; box-sizing: border-box; text-align: center; white-space: nowrap; font: 800 74px "Sora", sans-serif; background: #ffffff; color: var(--cor, #7C4DEB); border-radius: 999px; padding: 30px 64px; }
      .h24 { margin-top: 48px; font: 700 40px "Source Sans", sans-serif; color: #d9d4f5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="20">
      <div class="glow" id="glow"></div>

      <!-- Cena 1: abertura (0s–4s) -->
      <section id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="brand" id="s1-brand" data-var-text="negocio">Studio Exemplo</div>
        <div id="s1-tag" class="tag">Atendimento 24h</div>
        <h1 id="s1-title" class="big" data-var-text="chamada">Agende seu ensaio a qualquer hora</h1>
      </section>

      <!-- Cena 2: conversa de exemplo (4s–11s) -->
      <section id="s2" class="scene clip" data-start="4" data-duration="7" data-track-index="1">
        <div class="phone" id="s2-phone">
          <div class="phone-head">
            <div class="avatar" id="s2-avatar">✦</div>
            <div class="who"><span data-var-text="bot">Lia</span><small>online agora</small></div>
          </div>
          <div class="chat">
            <div class="bubble me" id="s2-ask" data-var-text="pergunta">Vocês abrem sábado?</div>
            <div class="reply">
              <div class="typing" id="s2-typing"><i id="s2-d1"></i><i id="s2-d2"></i><i id="s2-d3"></i></div>
              <div class="bubble bot" id="s2-answer" data-var-text="resposta">Abrimos sim!</div>
            </div>
          </div>
        </div>
        <div class="note" id="s2-note">Conversa ilustrativa</div>
      </section>

      <!-- Cena 3: o que o bot faz (11s–16s) -->
      <section id="s3" class="scene clip" data-start="11" data-duration="5" data-track-index="1">
        <h2 class="big" id="s3-title" style="font-size: 88px">O que a <span data-var-text="bot">Lia</span> faz por você</h2>
        <div class="list">
          <div class="item" id="s3-i1"><div class="check">✓</div><span data-var-text="item1">Tira dúvidas</span></div>
          <div class="item" id="s3-i2"><div class="check">✓</div><span data-var-text="item2">Lembra de você</span></div>
          <div class="item" id="s3-i3"><div class="check">✓</div><span data-var-text="item3">Pede seu horário</span></div>
        </div>
      </section>

      <!-- Cena 4: chamada final (16s–20s) -->
      <section id="s4" class="scene clip" data-start="16" data-duration="4" data-track-index="1">
        <h2 class="big" id="s4-title" data-var-text="final">Chame no Telegram</h2>
        <div class="handle" id="s4-handle" data-var-text="telegram">@studio_exemplo_bot</div>
        <div class="h24" id="s4-h24">Responde na hora, de dia ou de madrugada</div>
      </section>
    </div>

    <script>
      // Monta tudo depois que as fontes carregarem, para medir o texto com a fonte certa.
      document.fonts.ready.then(() => {
      // Um @ comprido encolhe até caber numa linha da pílula. O Telegram aceita até
      // 32 letras no @, e com 32 letras o texto ainda cabe acima do tamanho mínimo.
      // A medida é feita uma vez, numa tela invisível, com a fonte já carregada.
      const { telegram } = window.__hyperframes.getVariables();
      const regua = document.createElement("canvas").getContext("2d");
      let tamanho = 74;
      const largura = (px) => { regua.font = `800 ${px}px Sora`; return regua.measureText(telegram).width; };
      while (tamanho > 28 && largura(tamanho) > 800) tamanho -= 2;
      document.getElementById("s4-handle").style.fontSize = tamanho + "px";

      const tl = gsap.timeline({ paused: true });

      // Fundo respira devagar durante o vídeo todo.
      tl.fromTo("#glow", { scale: 0.9, opacity: 0.35 }, { scale: 1.08, opacity: 0.6, duration: 10, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // Cena 1
      tl.fromTo("#s1-brand", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#s1-tag", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#s1-title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.55);
      tl.to(["#s1-tag", "#s1-title", "#s1-brand"], { opacity: 0, y: -40, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 3.5);

      // Cena 2
      tl.fromTo("#s2-phone", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 4.0);
      tl.fromTo("#s2-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4.5);
      tl.fromTo("#s2-ask", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 5.0);
      tl.fromTo("#s2-typing", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.8);
      ["#s2-d1", "#s2-d2", "#s2-d3"].forEach((dot, i) => {
        tl.fromTo(dot, { y: 0 }, { y: -14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.9 + i * 0.12);
      });
      tl.to("#s2-typing", { opacity: 0, duration: 0.2 }, 7.3);
      tl.fromTo("#s2-answer", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.4);
      tl.to(["#s2-phone", "#s2-note"], { opacity: 0, y: -60, duration: 0.5, ease: "power2.in" }, 10.4);

      // Cena 3
      tl.fromTo("#s3-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 11.1);
      ["#s3-i1", "#s3-i2", "#s3-i3"].forEach((item, i) => {
        tl.fromTo(item, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 11.7 + i * 0.6);
      });
      tl.to(["#s3-title", "#s3-i1", "#s3-i2", "#s3-i3"], { opacity: 0, duration: 0.4, stagger: 0.04 }, 15.5);

      // Cena 4
      tl.fromTo("#s4-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 16.1);
      tl.fromTo("#s4-handle", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 16.6);
      tl.fromTo("#s4-h24", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 17.2);
      tl.to("#s4-handle", { scale: 1.05, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 18.2);

      window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
